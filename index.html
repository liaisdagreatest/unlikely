<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unlikely font</title>
<style>
@font-face {
    font-family: 'unlikely';
    src: url('https://liaisdagreatest.github.io/unlikely/Unlikely.ttf') format('truetype');
}
:root {
    --bg: #070709;
    --text: #f4f4f5;
    --border: rgba(255, 255, 255, 0.06);
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'unlikely', sans-serif;
    overflow: hidden;
    display: flex;
    height: 100vh;
}
.noise {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 50;
    opacity: 0.03;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)"/%3E%3C/svg%3E');
}
.sidebar {
    width: 320px;
    border-right: 1px solid var(--border);
    padding: 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: radial-gradient(circle at top left, rgba(255,255,255,0.04), transparent 70%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
}
.brand {
    font-size: 3.5rem;
    line-height: 0.9;
    margin-bottom: 3rem;
}
.controls {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.75rem;
    text-transform: lowercase;
    color: #888;
}
.control-group {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}
.control-header {
    display: flex;
    justify-content: space-between;
}
input[type="range"] {
    appearance: none;
    width: 100%;
    height: 1px;
    background: #333;
    outline: none;
}
input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
}
.download-btn {
    display: block;
    margin-top: 2rem;
    padding: 1.2rem;
    text-align: center;
    text-decoration: none;
    color: #000;
    background: linear-gradient(180deg, #ffffff 0%, #d4d4d4 100%);
    border-radius: 16px;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 4px 20px rgba(255,255,255,0.08);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.download-btn:hover {
    transform: translateY(-3px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 8px 25px rgba(255,255,255,0.12);
}
.stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem;
    background: radial-gradient(circle at center, rgba(255,255,255,0.02), transparent 60%);
}
.tester {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'unlikely', sans-serif;
    font-size: 10vw;
    outline: none;
    resize: none;
    line-height: 1;
    letter-spacing: 0px;
}
.tester::placeholder {
    color: rgba(255,255,255,0.05);
}
@media (max-width: 768px) {
    body { flex-direction: column; overflow: auto; height: auto; min-height: 100vh; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .stage { padding: 1.5rem; height: 60vh; }
    .tester { font-size: 15vw; }
}
</style>
</head>
<body>
<div class="noise"></div>

<div class="sidebar">
    <div>
        <div class="brand">unlikely.</div>
        <div class="controls">
            <div class="control-group">
                <div class="control-header">
                    <span>size</span>
                    <span id="size-val">120px</span>
                </div>
                <input type="range" id="size" min="20" max="400" value="120">
            </div>
            <div class="control-group">
                <div class="control-header">
                    <span>spacing</span>
                    <span id="spacing-val">0px</span>
                </div>
                <input type="range" id="spacing" min="-20" max="100" value="0">
            </div>
            <div class="control-group">
                <div class="control-header">
                    <span>height</span>
                    <span id="height-val">1</span>
                </div>
                <input type="range" id="height" min="0.5" max="3" step="0.1" value="1">
            </div>
        </div>
    </div>
    <a href="https://liaisdagreatest.github.io/unlikely/Unlikely.ttf" class="download-btn" download>get unlikely.ttf</a>
</div>

<div class="stage">
    <textarea class="tester" id="tester" spellcheck="false" placeholder="start typing."></textarea>
</div>

<script>
const t = document.getElementById('tester');
const s = document.getElementById('size');
const sp = document.getElementById('spacing');
const h = document.getElementById('height');

const sv = document.getElementById('size-val');
const spv = document.getElementById('spacing-val');
const hv = document.getElementById('height-val');

const u = () => {
    t.style.fontSize = s.value + 'px';
    t.style.letterSpacing = sp.value + 'px';
    t.style.lineHeight = h.value;
    
    sv.innerText = s.value + 'px';
    spv.innerText = sp.value + 'px';
    hv.innerText = h.value;
};

s.addEventListener('input', u);
sp.addEventListener('input', u);
h.addEventListener('input', u);

window.onload = () => {
    t.value = "";
    u();
};
</script>
</body>
</html>
